<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokeWorld — Quản trị</title>
<style>
  :root { --bg:#12141f; --card:#1c1f2e; --line:#2e3244; --text:#e8eaf5; --muted:#8f97b8;
          --accent:#e3350d; --ok:#3fb950; --warn:#f0b429; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 system-ui,sans-serif; }
  a { color:#6ea8fe; }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; background:var(--card);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; }
  header .sp { flex:1; }
  .wrap { max-width:1200px; margin:0 auto; padding:18px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .tab { padding:8px 16px; background:var(--card); border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  .tab.on { background:var(--accent); border-color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; text-align:center; }
  .stat b { display:block; font-size:26px; color:var(--warn); }
  .stat span { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; }
  tr:hover td { background:rgba(255,255,255,.03); }
  input,select,button,textarea { font:inherit; color:inherit; }
  input,select,textarea { background:#0e1018; border:1px solid var(--line); border-radius:7px; padding:8px 10px; width:100%; }
  button { background:#2a2f45; border:1px solid var(--line); border-radius:7px; padding:8px 14px; cursor:pointer; }
  button:hover { background:#333a55; }
  button.primary { background:var(--accent); border-color:var(--accent); }
  button.danger { background:#5a1f28; border-color:#7c2d3e; color:#ff9aa8; }
  button.ok { background:#1d4429; border-color:#2c6b3f; color:#8ce8a5; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row > * { flex:0 0 auto; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; }
  .b-ban { background:#5a1f28; color:#ff9aa8; }
  .b-on { background:#1d4429; color:#8ce8a5; }
  .login-box { max-width:340px; margin:12vh auto; }
  .login-box input { margin-bottom:10px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#000d;
           padding:10px 20px; border-radius:99px; opacity:0; transition:.25s; pointer-events:none; }
  #toast.show { opacity:1; }
  pre { background:#0e1018; padding:10px; border-radius:7px; overflow:auto; max-height:340px; font-size:12px; }
  .hide { display:none !important; }
</style>
</head>
<body>

<div id="login" class="login-box">
  <div class="card">
    <h1 style="margin-bottom:14px">🛡️ PokeWorld — Quản trị</h1>
    <input id="lg-user" placeholder="Tài khoản admin" autocomplete="username">
    <input id="lg-pass" type="password" placeholder="Mật khẩu" autocomplete="current-password">
    <button class="primary" style="width:100%" onclick="doLogin()">Đăng nhập</button>
    <p class="muted" style="margin-top:10px;font-size:12px">Tài khoản đặt trong file <code>.env</code> (ADMIN_USER / ADMIN_PASS).</p>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <h1>🛡️ PokeWorld Admin</h1>
    <span class="muted" id="server-name"></span>
    <span class="sp"></span>
    <button onclick="loadTab()">⟳ Làm mới</button>
    <button onclick="doFlush()">💾 Lưu DB</button>
    <button class="danger" onclick="doLogout()">Thoát</button>
  </header>
  <div class="wrap">
    <div class="tabs">
      <div class="tab on" data-tab="dash">Tổng quan</div>
      <div class="tab" data-tab="players">Người chơi</div>
      <div class="tab" data-tab="guilds">Bang hội</div>
      <div class="tab" data-tab="cosmetics">Thời trang</div>
      <div class="tab" data-tab="config">Cấu hình & Sự kiện</div>
      <div class="tab" data-tab="pvp">Lịch sử PvP</div>
      <div class="tab" data-tab="audit">Nhật ký</div>
    </div>
    <div id="view"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let token = localStorage.getItem('pw_admin_token') || '';
let tab = 'dash';

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n||0).toLocaleString('vi-VN');
const dt = ts => ts ? new Date(ts).toLocaleString('vi-VN') : '—';

async function api(path, opts = {}) {
  const res = await fetch('/api/admin' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers||{}) },
  });
  if (res.status === 403 || res.status === 401) { doLogout(); throw new Error('Hết phiên đăng nhập'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Lỗi máy chủ');
  return data;
}

async function doLogin() {
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('#lg-user').value, password: $('#lg-pass').value }),
    });
    const d = await r.json();
    if (!r.ok) return toast(d.error || 'Đăng nhập thất bại');
    token = d.token;
    localStorage.setItem('pw_admin_token', token);
    showApp();
  } catch (e) { toast(e.message); }
}
function doLogout() {
  token = ''; localStorage.removeItem('pw_admin_token');
  $('#app').classList.add('hide'); $('#login').classList.remove('hide');
}
function showApp() {
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  loadTab();
}
async function doFlush() { await api('/flush', { method: 'POST' }); toast('Đã lưu DB xuống đĩa'); }

document.addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  tab = t.dataset.tab;
  loadTab();
});

async function loadTab() {
  try {
    if (tab === 'dash') return renderDash(await api('/stats'));
    if (tab === 'players') return renderPlayers(await api('/players'));
    if (tab === 'guilds') return renderGuilds(await api('/guilds'));
    if (tab === 'cosmetics') return renderCosmetics(await api('/cosmetics'));
    if (tab === 'config') return renderConfig(await api('/stats'));
    if (tab === 'pvp') return renderPvp(await api('/pvp'));
    if (tab === 'audit') return renderAudit(await api('/audit'));
  } catch (e) { toast(e.message); }
}

function renderDash(s) {
  $('#server-name').textContent = s.config?.serverName || '';
  $('#view').innerHTML = `
    <div class="grid">
      <div class="stat"><b>${fmt(s.users)}</b><span>Tài khoản</span></div>
      <div class="stat"><b style="color:var(--ok)">${fmt(s.online)}</b><span>Đang online</span></div>
      <div class="stat"><b>${fmt(s.activeToday)}</b><span>Hoạt động 24h</span></div>
      <div class="stat"><b>${fmt(s.newToday)}</b><span>Đăng ký mới 24h</span></div>
      <div class="stat"><b>${fmt(s.pvpToday)}</b><span>Trận PvP 24h</span></div>
      <div class="stat"><b>${fmt(s.marriages)}</b><span>Cặp đôi</span></div>
      <div class="stat"><b>${fmt(s.guilds)}</b><span>Bang hội</span></div>
      <div class="stat"><b style="color:var(--accent)">${fmt(s.banned)}</b><span>Bị khóa</span></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:10px">📢 Thông báo toàn server</h3>
      <div class="row">
        <input id="bc-text" placeholder="Nội dung gửi tới mọi người chơi đang online" style="flex:1">
        <button class="primary" onclick="doBroadcast()">Gửi</button>
      </div>
    </div>`;
}
async function doBroadcast() {
  const text = $('#bc-text').value.trim();
  if (!text) return;
  await api('/broadcast', { method: 'POST', body: JSON.stringify({ text }) });
  $('#bc-text').value = ''; toast('Đã gửi thông báo');
}

function renderPlayers(d) {
  $('#view').innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <input id="q" placeholder="Tìm theo tên..." style="flex:1" oninput="searchPlayers()">
        <span class="muted">Tổng: ${fmt(d.total)}</span>
      </div>
      <div style="overflow:auto">
      <table>
        <thead><tr><th>Tên</th><th>Tiền</th><th>Dex</th><th>Huy hiệu</th><th>PvP</th><th>Hoạt động</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
        <tbody id="prows">
          ${d.rows.map(p => `
          <tr>
            <td><b>${esc(p.username)}</b><br><span class="muted" style="font-size:11px">${p.avatar}</span></td>
            <td>${fmt(p.money)}₽</td>
            <td>${p.dex}</td>
            <td>${p.badges}</td>
            <td>${p.stats?.pvpWin||0}/${p.stats?.pvpLose||0}</td>
            <td class="muted" style="font-size:12px">${dt(p.lastSeen)}</td>
            <td>${p.banned ? `<span class="badge b-ban">KHÓA</span>` : `<span class="badge b-on">OK</span>`}
                ${p.warnings?.length ? `<span class="badge" style="background:#4a3a10;color:#f0b429" title="${esc(p.warnings.join('\\n'))}">⚠ ${p.warnings.length}</span>` : ''}</td>
            <td class="row">
              <button onclick="grant('${p.id}','${esc(p.username)}')">🎁</button>
              <button title="Trao thời trang" onclick="openGrant('${p.id}','${esc(p.username)}')">🏷</button>
              <button onclick="resetPass('${p.id}')">🔑</button>
              ${p.banned
                ? `<button class="ok" onclick="ban('${p.id}',false)">Mở</button>`
                : `<button class="danger" onclick="ban('${p.id}',true)">Khóa</button>`}
              <button class="danger" onclick="delPlayer('${p.id}','${esc(p.username)}')">🗑</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
      </div>
    </div>
    <div id="grant-box"></div>`;
}
let searchTimer;
function searchPlayers() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const q = $('#q').value;
    const d = await api('/players?q=' + encodeURIComponent(q));
    const keep = $('#q').value;
    renderPlayers(d);
    $('#q').value = keep; $('#q').focus();
  }, 300);
}
async function ban(id, banned) {
  const reason = banned ? (prompt('Lý do khóa tài khoản:', 'Vi phạm quy định') || '') : '';
  if (banned && reason === null) return;
  await api(`/player/${id}/ban`, { method: 'POST', body: JSON.stringify({ banned, reason }) });
  toast(banned ? 'Đã khóa' : 'Đã mở khóa'); loadTab();
}
async function grant(id, name) {
  const money = Number(prompt(`Tặng tiền cho ${name} (số âm để trừ):`, '10000'));
  if (Number.isNaN(money)) return;
  const itemId = prompt('ID vật phẩm (bỏ trống nếu không tặng):', 'rare_candy') || '';
  const itemQty = itemId ? Number(prompt('Số lượng:', '5')) || 1 : 0;
  await api(`/player/${id}/grant`, { method: 'POST', body: JSON.stringify({ money, itemId, itemQty }) });
  toast('Đã tặng'); loadTab();
}
async function resetPass(id) {
  const password = prompt('Mật khẩu mới (>= 6 ký tự):');
  if (!password) return;
  await api(`/player/${id}/password`, { method: 'POST', body: JSON.stringify({ password }) });
  toast('Đã đổi mật khẩu');
}
async function delPlayer(id, name) {
  if (!confirm(`XÓA VĨNH VIỄN tài khoản ${name}? Không thể hoàn tác!`)) return;
  if (!confirm('Chắc chắn chứ?')) return;
  await api(`/player/${id}`, { method: 'DELETE' });
  toast('Đã xóa'); loadTab();
}

let guildRows = [];
const ROLE_VI = { leader: 'Hội trưởng', officer: 'Phó hội', member: 'Thành viên' };
function renderGuilds(d) {
  guildRows = d.rows || [];
  $('#view').innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <input id="gq" placeholder="Tìm theo tên hoặc tag..." style="flex:1" oninput="searchGuilds()">
        <span class="muted">Tổng: ${fmt(d.total)}</span>
      </div>
      <div style="overflow:auto">
      <table>
        <thead><tr><th>Tên</th><th>Tag</th><th>Cấp</th><th>Thành viên</th><th>Quỹ</th><th>Hội trưởng</th><th>Lập ngày</th><th>Thao tác</th></tr></thead>
        <tbody>
          ${guildRows.map((g, i) => `
          <tr>
            <td><b>${esc(g.name)}</b><br><span class="muted" style="font-size:11px">icon ${g.icon}</span></td>
            <td>[${esc(g.tag)}]</td>
            <td>${g.level}</td>
            <td>${g.members}/${g.maxMembers}</td>
            <td>${fmt(g.treasury)}₽</td>
            <td>${esc(g.leader)}</td>
            <td class="muted" style="font-size:12px">${dt(g.createdAt)}</td>
            <td class="row">
              <button onclick="showGuildMembers(${i})">Thành viên</button>
              <button class="danger" onclick="disbandGuild('${g.id}','${esc(g.name)}')">Giải tán</button>
            </td>
          </tr>`).join('') || '<tr><td colspan="8" class="muted">Chưa có bang hội nào</td></tr>'}
        </tbody>
      </table>
      </div>
    </div>
    <div id="gmembers"></div>`;
}
let guildSearchTimer;
function searchGuilds() {
  clearTimeout(guildSearchTimer);
  guildSearchTimer = setTimeout(async () => {
    const q = $('#gq').value;
    const d = await api('/guilds?q=' + encodeURIComponent(q));
    renderGuilds(d);
    $('#gq').value = q; $('#gq').focus();
  }, 300);
}
function showGuildMembers(i) {
  const g = guildRows[i];
  if (!g) return;
  $('#gmembers').innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:10px">Thành viên — ${esc(g.name)} [${esc(g.tag)}]</h3>
      <table><thead><tr><th>Tên</th><th>Chức vụ</th><th>Cống hiến</th><th>Gia nhập</th></tr></thead><tbody>
      ${g.memberList.map(m => `<tr><td><b>${esc(m.username)}</b></td><td>${ROLE_VI[m.role] || esc(m.role)}</td>
        <td>${fmt(m.contribution)}₽</td><td class="muted" style="font-size:12px">${dt(m.joinedAt)}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
}
async function disbandGuild(id, name) {
  if (!confirm(`Giải tán bang hội ${name}? Không thể hoàn tác!`)) return;
  await api('/guild/' + id, { method: 'DELETE' });
  toast('Đã giải tán bang hội'); loadTab();
}

// ==== Thời trang: danh hiệu / khung avatar / khung chat / skin ====
const KIND_VI = { title:'Danh hiệu', avatarFrame:'Khung avatar', chatFrame:'Khung chat', skin:'Skin' };
const HOW_VI = { start:'Có sẵn từ đầu', catch:'Bắt đủ N sinh vật', win:'Thắng N trận',
                 badge:'Có N huy hiệu', level:'Trainer Lv.N', manual:'Admin trao tay' };
let cosRows = [];

function howText(c) {
  if (c.how === 'start') return 'Có sẵn từ đầu';
  if (c.how === 'manual') return '<b style="color:var(--warn)">Admin trao tay</b>';
  return esc((HOW_VI[c.how] || c.how).replace('N', c.n));
}

function renderCosmetics(d) {
  cosRows = d.rows || [];
  $('#view').innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:10px">👗 Thêm / sửa món thời trang</h3>
      <div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        <label>Loại<select id="co-kind">${(d.kinds||[]).map(k => `<option value="${k}">${KIND_VI[k]||k}</option>`).join('')}</select></label>
        <label>Mã món (a-z, 0-9, _)<input id="co-id" placeholder="vd: tet_2026"></label>
        <label>Tên hiển thị<input id="co-name" placeholder="vd: Chúa Tể Mùa Xuân"></label>
        <label>Màu chữ<input id="co-color" type="color" value="#ffd43b" style="height:38px;padding:2px"></label>
        <label>Điều kiện nhận<select id="co-how">${(d.hows||[]).map(h => `<option value="${h}"${h==='manual'?' selected':''}>${HOW_VI[h]||h}</option>`).join('')}</select></label>
        <label>Số N (nếu điều kiện cần)<input id="co-n" type="number" min="0" value="0"></label>
      </div>
      <p class="muted" style="margin:10px 0">Chọn <b>Admin trao tay</b> nếu món này không có điều kiện tự đạt — khi đó chỉ admin trao ở tab Người chơi mới có.</p>
      <button class="primary" onclick="saveCosmetic()">Lưu món</button>
      <span class="muted" style="margin-left:10px">Lưu lại đúng loại + mã cũ để sửa món đã có.</span>
    </div>

    <div class="card">
      <h3 style="margin-bottom:10px">Kho thời trang (${cosRows.length} món)</h3>
      <p class="muted" style="margin-bottom:10px">Toàn bộ thời trang trong game là ảnh tải lên ở đây — món <b>chưa có ảnh</b> sẽ hiện trơ tên trong game, nhớ tải ảnh cho từng món. PNG nền trong suốt, tối đa 2MB.<br>
      Gợi ý cỡ ảnh: khung avatar ~100×100, khung chat ~128×48 (kéo giãn 9 phần), danh hiệu ~96×24, skin ~64×64.<br>
      Riêng <b>skin</b>: ảnh 64×64 chỉ đổi ảnh nhân vật trong giao diện; muốn đổi cả nhân vật đi trên bản đồ thì tải bộ sprite <b>3 cột × 4 hàng</b> (vd 48×128 — hàng xuống/trái/phải/lên).</p>
      <div style="overflow:auto">
      <table>
        <thead><tr><th>Ảnh</th><th>Loại</th><th>Mã</th><th>Tên</th><th>Điều kiện</th><th>Thao tác</th></tr></thead>
        <tbody>
        ${cosRows.map((c, i) => `
          <tr>
            <td>${c.img
              ? `<img src="${esc(c.img)}" alt="" style="height:34px;image-rendering:pixelated;background:#0e1018;border-radius:6px">`
              : '<span class="badge b-ban">THIẾU ẢNH</span>'}</td>
            <td>${KIND_VI[c.kind] || esc(c.kind)}</td>
            <td><code>${esc(c.id)}</code></td>
            <td><b style="color:${esc(c.color||'#fff')}">${esc(c.name)}</b></td>
            <td>${howText(c)}</td>
            <td class="row">
              <button onclick="pickImage('${esc(c.kind)}:${esc(c.id)}')">🖼 Ảnh</button>
              ${c.img ? `<button onclick="dropImage('${esc(c.kind)}:${esc(c.id)}')">Gỡ ảnh</button>` : ''}
              <button onclick="editCosmetic(${i})">✏️</button>
              <button class="danger" onclick="delCosmetic('${esc(c.kind)}:${esc(c.id)}','${esc(c.name)}')">🗑</button>
            </td>
          </tr>`).join('') || '<tr><td colspan="6" class="muted">Chưa có món nào — thêm ở khung trên.</td></tr>'}
        </tbody>
      </table>
      </div>
    </div>

    <input type="file" id="co-file" accept="image/png,image/jpeg,image/gif,image/webp" class="hide">`;

  $('#co-file').addEventListener('change', uploadImage);
}

async function saveCosmetic() {
  const body = {
    kind: $('#co-kind').value, id: $('#co-id').value, name: $('#co-name').value,
    color: $('#co-color').value, how: $('#co-how').value, n: $('#co-n').value,
  };
  await api('/cosmetics', { method: 'POST', body: JSON.stringify(body) });
  toast('Đã lưu món thời trang'); loadTab();
}
function editCosmetic(i) {
  const c = cosRows[i];
  if (!c) return;
  $('#co-kind').value = c.kind; $('#co-id').value = c.id; $('#co-name').value = c.name;
  $('#co-color').value = c.color || '#ffd43b'; $('#co-how').value = c.how; $('#co-n').value = c.n || 0;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
async function delCosmetic(key, name) {
  if (!confirm(`Xóa "${name}"? Người đang mặc sẽ mất món này.`)) return;
  await api('/cosmetics/' + encodeURIComponent(key), { method: 'DELETE' });
  toast('Đã xóa'); loadTab();
}

let uploadKey = '';
function pickImage(key) { uploadKey = key; $('#co-file').value = ''; $('#co-file').click(); }
async function uploadImage(e) {
  const file = e.target.files?.[0];
  if (!file || !uploadKey) return;
  if (file.size > 2 * 1024 * 1024) return toast('Ảnh tối đa 2MB');
  try {
    // Gửi thẳng tệp trong body, Content-Type là kiểu ảnh — máy chủ đọc bằng express.raw
    const res = await fetch(`/api/admin/cosmetics/${encodeURIComponent(uploadKey)}/image`, {
      method: 'POST',
      headers: { 'Content-Type': file.type, Authorization: 'Bearer ' + token },
      body: file,
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.error || 'Tải ảnh thất bại');
    toast('Đã tải ảnh lên'); loadTab();
  } catch (err) { toast(err.message); }
}
async function dropImage(key) {
  await api(`/cosmetics/${encodeURIComponent(key)}/image`, { method: 'DELETE' });
  toast('Đã gỡ ảnh'); loadTab();
}

// ==== Trao thời trang cho một người chơi ====
async function openGrant(id, name) {
  try {
    const [cat, mine] = await Promise.all([api('/cosmetics'), api(`/player/${id}/cosmetics`)]);
    const have = new Set(mine.cosmetics || []);
    const all = cat.rows || [];
    $('#grant-box').innerHTML = `
      <div class="card">
        <h3 style="margin-bottom:10px">🏷 Trao thời trang — ${esc(name)}</h3>
        <table><thead><tr><th>Loại</th><th>Món</th><th>Điều kiện</th><th>Trạng thái</th><th></th></tr></thead><tbody>
        ${all.map(c => {
          const key = `${c.kind}:${c.id}`;
          const has = have.has(key);
          return `<tr>
            <td>${KIND_VI[c.kind] || esc(c.kind)}</td>
            <td><b>${esc(c.name)}</b> <code class="muted">${esc(c.id)}</code></td>
            <td>${howText(c)}</td>
            <td>${has ? '<span class="badge b-on">ĐÃ TRAO</span>' : '<span class="muted">chưa</span>'}</td>
            <td>${has
              ? `<button class="danger" onclick="doGrant('${id}','${esc(name)}','${key}',false)">Thu hồi</button>`
              : `<button class="ok" onclick="doGrant('${id}','${esc(name)}','${key}',true)">Trao</button>`}</td>
          </tr>`;
        }).join('') || '<tr><td colspan="5" class="muted">Chưa có món nào — thêm ở tab Thời trang trước.</td></tr>'}
        </tbody></table>
        <p class="muted" style="margin-top:10px">Người chơi đang online sẽ mở khoá ngay, không cần đăng nhập lại.</p>
      </div>`;
    $('#grant-box').scrollIntoView({ behavior: 'smooth' });
  } catch (e) { toast(e.message); }
}
async function doGrant(id, name, key, give) {
  await api(`/player/${id}/cosmetic`, { method: 'POST', body: JSON.stringify({ key, give }) });
  toast(give ? 'Đã trao' : 'Đã thu hồi');
  openGrant(id, name);
}

function renderConfig(s) {
  const c = s.config || {};
  $('#view').innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:12px">⚙️ Cấu hình máy chủ</h3>
      <div style="display:grid;gap:12px;max-width:520px">
        <label>Tên máy chủ<input id="c-name" value="${esc(c.serverName)}"></label>
        <label>Thông báo chào (MOTD)<textarea id="c-motd" rows="2">${esc(c.motd)}</textarea></label>
        <label>Hệ số EXP (1-10)<input id="c-exp" type="number" min="1" max="10" step="0.5" value="${c.expMult}"></label>
        <label>Hệ số tiền (1-10)<input id="c-money" type="number" min="1" max="10" step="0.5" value="${c.moneyMult}"></label>
        <label>Hệ số tỉ lệ shiny (1-50)<input id="c-shiny" type="number" min="1" max="50" step="1" value="${c.shinyMult}"></label>
        <button class="primary" onclick="saveConfig()">Lưu & áp dụng ngay</button>
      </div>
      <p class="muted" style="margin-top:12px">Thay đổi có hiệu lực tức thì với mọi người chơi đang online (không cần khởi động lại).</p>
    </div>`;
}
async function saveConfig() {
  await api('/config', { method: 'PUT', body: JSON.stringify({
    serverName: $('#c-name').value, motd: $('#c-motd').value,
    expMult: $('#c-exp').value, moneyMult: $('#c-money').value, shinyMult: $('#c-shiny').value,
  })});
  toast('Đã áp dụng cấu hình'); loadTab();
}

function renderPvp(d) {
  $('#view').innerHTML = `<div class="card"><h3 style="margin-bottom:10px">⚔️ Lịch sử PvP (100 trận gần nhất)</h3>
    <table><thead><tr><th>Thời gian</th><th>Người thắng</th><th>Người thua</th><th></th></tr></thead><tbody>

      <td>${esc(r.loser||'—')}</td><td>${r.disputed?'<span class="badge b-ban">LỆCH KẾT QUẢ</span>':''}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Chưa có trận nào</td></tr>'}
    </tbody></table></div>`;
}

function renderAudit(d) {
  $('#view').innerHTML = `<div class="card"><h3 style="margin-bottom:10px">📋 Nhật ký thao tác admin</h3>
    <table><thead><tr><th>Thời gian</th><th>Admin</th><th>Hành động</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead><tbody>
    ${d.rows.map(r => `<tr><td class="muted">${dt(r.ts)}</td><td>${esc(r.admin)}</td>
      <td><b>${esc(r.action)}</b></td><td>${esc(r.target)}</td><td class="muted">${esc(r.detail||'')}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Chưa có</td></tr>'}
    </tbody></table></div>`;
}

$('#lg-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
if (token) showApp();
</script>
