<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TuxeWorld — Quản trị</title>
<style>
  :root { --bg:#0f111a; --card:#1a1d2b; --card2:#151826; --line:#2a2e40; --text:#e8eaf5;
          --muted:#8f97b8; --accent:#e3350d; --ok:#3fb950; --warn:#f0b429; --blue:#4a7bd4;
          --side:250px; --top:56px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,sans-serif; }
  a { color:#6ea8fe; }
  code { font-size:12px; color:#9fd0ff; }
  h2 { font-size:19px; }
  h3 { font-size:15px; }

  /* ==== Khung trang: thanh trên cố định + menu dọc bên trái ==== */
  .top { position:fixed; inset:0 0 auto 0; height:var(--top); z-index:20;
         display:flex; align-items:center; gap:12px; padding:0 16px;
         background:linear-gradient(180deg,#20243a,#1a1d2b); border-bottom:1px solid var(--line); }
  .top .brand { display:flex; align-items:center; gap:9px; font-weight:700; font-size:15px; }
  .top .brand i { font-style:normal; font-size:19px; }
  .top .sp { flex:1; }
  .top .who { color:var(--muted); font-size:12px; }
  .burger { display:none; }

  .side { position:fixed; top:var(--top); bottom:0; left:0; width:var(--side); overflow:auto;
          background:var(--card2); border-right:1px solid var(--line); padding:14px 10px 30px; z-index:15; }
  .side .grp { color:var(--muted); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
               margin:14px 10px 6px; }
  .side .grp:first-child { margin-top:0; }
  .nav { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px;
         cursor:pointer; color:#c9cfe6; user-select:none; }
  .nav:hover { background:#232840; }
  .nav.on { background:var(--accent); color:#fff; font-weight:600; }
  .nav i { font-style:normal; width:20px; text-align:center; }
  .nav .n { margin-left:auto; background:#333a55; border-radius:99px; font-size:11px; padding:1px 7px; }
  .nav.on .n { background:#0004; }

  .main { margin:var(--top) 0 0 var(--side); padding:20px 22px 60px; max-width:1250px; }
  .page-head { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .page-head .sp { flex:1; }
  .page-head p { color:var(--muted); font-size:12.5px; flex-basis:100%; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card > h3 { margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .form { display:grid; gap:11px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }
  .form label, .form-1 label { display:block; font-size:12.5px; color:var(--muted); }
  .form label > input, .form label > select, .form label > textarea { margin-top:4px; }
  .form-1 { display:grid; gap:11px; max-width:560px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center; }
  .stat b { display:block; font-size:26px; color:var(--warn); }
  .stat span { color:var(--muted); font-size:12px; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; }
  tr:hover td { background:rgba(255,255,255,.03); }
  .scroll { overflow:auto; }

  input,select,button,textarea { font:inherit; color:inherit; }
  input,select,textarea { background:#0e1018; border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; }
  textarea { resize:vertical; }
  button { background:#2a2f45; border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; }
  button:hover { background:#333a55; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); }
  button.danger { background:#5a1f28; border-color:#7c2d3e; color:#ff9aa8; }
  button.ok { background:#1d4429; border-color:#2c6b3f; color:#8ce8a5; }
  button.sm { padding:5px 10px; font-size:12.5px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row > * { flex:0 0 auto; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; }
  .b-ban { background:#5a1f28; color:#ff9aa8; }
  .b-on { background:#1d4429; color:#8ce8a5; }
  .b-off { background:#3a3f55; color:#b9c0da; }
  .b-warn { background:#4a3a10; color:#f0b429; }

  /* Hàng con trong trình dựng sự kiện */
  .sub { border:1px dashed var(--line); border-radius:10px; padding:11px; margin-bottom:9px;
         display:grid; gap:9px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); align-items:end; }
  .sub .del { grid-column:auto; }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; }
  .thumb { background:#0e1018; border:1px solid var(--line); border-radius:9px; padding:8px; text-align:center; }
  .thumb img { max-width:100%; height:70px; object-fit:contain; image-rendering:pixelated; }
  .thumb .u { font-size:10px; color:var(--muted); word-break:break-all; margin:5px 0; }

  .login-box { max-width:340px; margin:12vh auto; }
  .login-box input { margin-bottom:10px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#000d;
           padding:10px 20px; border-radius:99px; opacity:0; transition:.25s; pointer-events:none; z-index:50; }
  #toast.show { opacity:1; }
  .hide { display:none !important; }

  @media (max-width:900px) {
    .burger { display:block; }
    .side { transform:translateX(-100%); transition:transform .2s; }
    .side.open { transform:none; }
    .main { margin-left:0; padding:16px 12px 60px; }
  }
</style>
</head>
<body>

<div id="login" class="login-box">
  <div class="card">
    <h2 style="margin-bottom:14px">🛡️ TuxeWorld — Quản trị</h2>
    <input id="lg-user" placeholder="Tài khoản admin" autocomplete="username">
    <input id="lg-pass" type="password" placeholder="Mật khẩu" autocomplete="current-password">
    <button class="primary" style="width:100%" onclick="doLogin()">Đăng nhập</button>
    <p class="muted" style="margin-top:10px;font-size:12px">Tài khoản đặt trong file <code>.env</code> (ADMIN_USER / ADMIN_PASS).</p>
  </div>
</div>

<div id="app" class="hide">
  <div class="top">
    <button class="burger sm" onclick="document.querySelector('.side').classList.toggle('open')">☰</button>
    <div class="brand"><i>🛡️</i> TuxeWorld Admin</div>
    <span class="who" id="server-name"></span>
    <span class="sp"></span>
    <button class="sm" onclick="loadPage()">⟳ Làm mới</button>
    <button class="sm" onclick="doFlush()">💾 Lưu DB</button>
    <button class="sm danger" onclick="doLogout()">Thoát</button>
  </div>

  <nav class="side" id="side"></nav>
  <main class="main" id="view"></main>
</div>

<div id="toast"></div>
<input type="file" id="file-pick" accept="image/png,image/jpeg,image/gif,image/webp" class="hide">

<script>
const $ = s => document.querySelector(s);
let token = localStorage.getItem('pw_admin_token') || '';
let page = location.hash.slice(1) || 'dash';
let META = { kinds: [], hows: [], howNames: {}, vars: [] };

const MENU = [
  { grp: 'Vận hành', items: [
    { id: 'dash',      icon: '📊', name: 'Tổng quan' },
    { id: 'players',   icon: '👤', name: 'Người chơi' },
    { id: 'guilds',    icon: '🏰', name: 'Bang hội' },
  ]},
  { grp: 'Nội dung', items: [
    { id: 'events',    icon: '🎉', name: 'Sự kiện' },
    { id: 'cosmetics', icon: '👗', name: 'Thời trang' },
    { id: 'codes',     icon: '🎟️', name: 'Giftcode' },
    { id: 'mail',      icon: '✉️', name: 'Gửi thư' },
    { id: 'news',      icon: '🔔', name: 'Tin tức' },
    { id: 'uploads',   icon: '🖼️', name: 'Kho ảnh' },
  ]},
  { grp: 'Hệ thống', items: [
    { id: 'config',    icon: '⚙️', name: 'Cấu hình' },
    { id: 'pvp',       icon: '⚔️', name: 'Lịch sử PvP' },
    { id: 'audit',     icon: '📋', name: 'Nhật ký' },
  ]},
];

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n||0).toLocaleString('vi-VN');
const dt = ts => ts ? new Date(ts).toLocaleString('vi-VN') : '—';
// <input type="datetime-local"> <-> mốc thời gian
const toLocal = ts => { if (!ts) return ''; const d = new Date(ts - new Date().getTimezoneOffset()*60000); return d.toISOString().slice(0,16); };
const fromLocal = s => s ? new Date(s).getTime() : 0;

async function api(path, opts = {}) {
  const res = await fetch('/api/admin' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers||{}) },
  });
  if (res.status === 403 || res.status === 401) { doLogout(); throw new Error('Hết phiên đăng nhập'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Lỗi máy chủ');
  return data;
}

async function doLogin() {
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('#lg-user').value, password: $('#lg-pass').value }),
    });
    const d = await r.json();
    if (!r.ok) return toast(d.error || 'Đăng nhập thất bại');
    token = d.token;
    localStorage.setItem('pw_admin_token', token);
    showApp();
  } catch (e) { toast(e.message); }
}
function doLogout() {
  token = ''; localStorage.removeItem('pw_admin_token');
  $('#app').classList.add('hide'); $('#login').classList.remove('hide');
}
async function showApp() {
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  try { META = await api('/meta'); } catch (e) { /* menu vẫn chạy được */ }
  drawMenu();
  loadPage();
}
async function doFlush() { await api('/flush', { method: 'POST' }); toast('Đã lưu DB xuống đĩa'); }

function drawMenu() {
  $('#side').innerHTML = MENU.map(g => `
    <div class="grp">${g.grp}</div>
    ${g.items.map(it => `<div class="nav ${it.id === page ? 'on' : ''}" data-page="${it.id}">
      <i>${it.icon}</i><span>${it.name}</span></div>`).join('')}`).join('');
}

document.addEventListener('click', e => {
  const n = e.target.closest('.nav');
  if (!n) return;
  page = n.dataset.page;
  location.hash = page;
  $('#side').classList.remove('open');
  drawMenu();
  loadPage();
});
window.addEventListener('hashchange', () => {
  const p = location.hash.slice(1);
  if (p && p !== page) { page = p; drawMenu(); loadPage(); }
});

const PAGES = {};
async function loadPage() {
  try {
    const fn = PAGES[page] || PAGES.dash;
    await fn();
    window.scrollTo({ top: 0 });
  } catch (e) { toast(e.message); }
}

// Tiêu đề trang dùng chung
function head(title, note = '', right = '') {
  return `<div class="page-head"><h2>${title}</h2><span class="sp"></span>${right}
    ${note ? `<p>${note}</p>` : ''}</div>`;
}

/* ==================== Tổng quan ==================== */
PAGES.dash = async () => {
  const s = await api('/stats');
  $('#server-name').textContent = s.config?.serverName || '';
  $('#view').innerHTML = head('Tổng quan') + `
    <div class="grid">
      <div class="stat"><b>${fmt(s.users)}</b><span>Tài khoản</span></div>
      <div class="stat"><b style="color:var(--ok)">${fmt(s.online)}</b><span>Đang online</span></div>
      <div class="stat"><b>${fmt(s.activeToday)}</b><span>Hoạt động 24h</span></div>
      <div class="stat"><b>${fmt(s.newToday)}</b><span>Đăng ký mới 24h</span></div>
      <div class="stat"><b>${fmt(s.pvpToday)}</b><span>Trận PvP 24h</span></div>
      <div class="stat"><b>${fmt(s.marriages)}</b><span>Cặp đôi</span></div>
      <div class="stat"><b>${fmt(s.guilds)}</b><span>Bang hội</span></div>
      <div class="stat"><b style="color:var(--accent)">${fmt(s.banned)}</b><span>Bị khóa</span></div>
    </div>
    <div class="card">
      <h3>📢 Loa toàn máy chủ</h3>
      <p class="muted" style="margin-bottom:10px">Chỉ hiện ở khung chat cho người đang online. Muốn để lại lâu dài thì đăng ở mục <b>Tin tức</b>.</p>
      <div class="row">
        <input id="bc-text" placeholder="Nội dung gửi tới mọi người chơi đang online" style="flex:1">
        <button class="primary" onclick="doBroadcast()">Gửi</button>
      </div>
    </div>`;
};
async function doBroadcast() {
  const text = $('#bc-text').value.trim();
  if (!text) return;
  await api('/broadcast', { method: 'POST', body: JSON.stringify({ text }) });
  $('#bc-text').value = ''; toast('Đã gửi thông báo');
}

/* ==================== Người chơi ==================== */
PAGES.players = async () => renderPlayers(await api('/players'));

function renderPlayers(d) {
  $('#view').innerHTML = head('Người chơi', `Tổng ${fmt(d.total)} tài khoản, hiện tối đa 200 dòng.`) + `
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <input id="q" placeholder="Tìm theo tên..." style="flex:1" oninput="searchPlayers()">
      </div>
      <div class="scroll">
      <table>
        <thead><tr><th>Tên</th><th>Tiền</th><th>Dex</th><th>Huy hiệu</th><th>PvP</th><th>Hoạt động</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
        <tbody>
          ${d.rows.map(p => `
          <tr>
            <td><b>${esc(p.username)}</b><br><span class="muted" style="font-size:11px">${esc(p.avatar)}</span></td>
            <td>$${fmt(p.money)}</td>
            <td>${p.dex}</td>
            <td>${p.badges}</td>
            <td>${p.stats?.pvpWin||0}/${p.stats?.pvpLose||0}</td>
            <td class="muted" style="font-size:12px">${dt(p.lastSeen)}</td>
            <td>${p.banned ? `<span class="badge b-ban">KHÓA</span>` : `<span class="badge b-on">OK</span>`}
                ${p.warnings?.length ? `<span class="badge b-warn" title="${esc(p.warnings.join('\\n'))}">⚠ ${p.warnings.length}</span>` : ''}</td>
            <td class="row">
              <button class="sm" title="Tặng tiền / vật phẩm" onclick="grant('${p.id}','${esc(p.username)}')">🎁</button>
              <button class="sm" title="Trao thời trang" onclick="openGrant('${p.id}','${esc(p.username)}')">🏷</button>
              <button class="sm" title="Đổi mật khẩu" onclick="resetPass('${p.id}')">🔑</button>
              ${p.banned
                ? `<button class="sm ok" onclick="ban('${p.id}',false)">Mở</button>`
                : `<button class="sm danger" onclick="ban('${p.id}',true)">Khóa</button>`}
              <button class="sm danger" onclick="delPlayer('${p.id}','${esc(p.username)}')">🗑</button>
            </td>
          </tr>`).join('') || '<tr><td colspan="8" class="muted">Không có ai khớp.</td></tr>'}
        </tbody>
      </table>
      </div>
    </div>
    <div id="grant-box"></div>`;
}
let searchTimer;
function searchPlayers() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const q = $('#q').value;
    const d = await api('/players?q=' + encodeURIComponent(q));
    renderPlayers(d);
    $('#q').value = q; $('#q').focus();
  }, 300);
}
async function ban(id, banned) {
  const reason = banned ? prompt('Lý do khóa tài khoản:', 'Vi phạm quy định') : '';
  if (banned && reason === null) return;
  await api(`/player/${id}/ban`, { method: 'POST', body: JSON.stringify({ banned, reason }) });
  toast(banned ? 'Đã khóa' : 'Đã mở khóa'); loadPage();
}
async function grant(id, name) {
  const money = Number(prompt(`Tặng tiền cho ${name} (số âm để trừ):`, '10000'));
  if (Number.isNaN(money)) return;
  const itemId = prompt('ID vật phẩm (bỏ trống nếu không tặng):', 'potion') || '';
  const itemQty = itemId ? Number(prompt('Số lượng:', '5')) || 1 : 0;
  await api(`/player/${id}/grant`, { method: 'POST', body: JSON.stringify({ money, itemId, itemQty }) });
  toast('Đã tặng'); loadPage();
}
async function resetPass(id) {
  const password = prompt('Mật khẩu mới (>= 6 ký tự):');
  if (!password) return;
  await api(`/player/${id}/password`, { method: 'POST', body: JSON.stringify({ password }) });
  toast('Đã đổi mật khẩu');
}
async function delPlayer(id, name) {
  if (!confirm(`XÓA VĨNH VIỄN tài khoản ${name}? Không thể hoàn tác!`)) return;
  if (!confirm('Chắc chắn chứ?')) return;
  await api(`/player/${id}`, { method: 'DELETE' });
  toast('Đã xóa'); loadPage();
}

/* ==================== Bang hội ==================== */
let guildRows = [];
const ROLE_VI = { leader: 'Hội trưởng', officer: 'Phó hội', member: 'Thành viên' };
PAGES.guilds = async () => renderGuilds(await api('/guilds'));

function renderGuilds(d) {
  guildRows = d.rows || [];
  $('#view').innerHTML = head('Bang hội', `Tổng ${fmt(d.total)} bang.`) + `
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <input id="gq" placeholder="Tìm theo tên hoặc tag..." style="flex:1" oninput="searchGuilds()">
      </div>
      <div class="scroll">
      <table>
        <thead><tr><th>Tên</th><th>Tag</th><th>Cấp</th><th>Thành viên</th><th>Quỹ</th><th>Hội trưởng</th><th>Lập ngày</th><th>Thao tác</th></tr></thead>
        <tbody>
          ${guildRows.map((g, i) => `
          <tr>
            <td><b>${esc(g.name)}</b><br><span class="muted" style="font-size:11px">icon ${esc(g.icon)}</span></td>
            <td>[${esc(g.tag)}]</td>
            <td>${g.level}</td>
            <td>${g.members}/${g.maxMembers}</td>
            <td>$${fmt(g.treasury)}</td>
            <td>${esc(g.leader)}</td>
            <td class="muted" style="font-size:12px">${dt(g.createdAt)}</td>
            <td class="row">
              <button class="sm" onclick="showGuildMembers(${i})">Thành viên</button>
              <button class="sm danger" onclick="disbandGuild('${g.id}','${esc(g.name)}')">Giải tán</button>
            </td>
          </tr>`).join('') || '<tr><td colspan="8" class="muted">Chưa có bang hội nào</td></tr>'}
        </tbody>
      </table>
      </div>
    </div>
    <div id="gmembers"></div>`;
}
let guildSearchTimer;
function searchGuilds() {
  clearTimeout(guildSearchTimer);
  guildSearchTimer = setTimeout(async () => {
    const q = $('#gq').value;
    renderGuilds(await api('/guilds?q=' + encodeURIComponent(q)));
    $('#gq').value = q; $('#gq').focus();
  }, 300);
}
function showGuildMembers(i) {
  const g = guildRows[i];
  if (!g) return;
  $('#gmembers').innerHTML = `
    <div class="card">
      <h3>Thành viên — ${esc(g.name)} [${esc(g.tag)}]</h3>
      <table><thead><tr><th>Tên</th><th>Chức vụ</th><th>Cống hiến</th><th>Gia nhập</th></tr></thead><tbody>
      ${g.memberList.map(m => `<tr><td><b>${esc(m.username)}</b></td><td>${ROLE_VI[m.role] || esc(m.role)}</td>
        <td>$${fmt(m.contribution)}</td><td class="muted" style="font-size:12px">${dt(m.joinedAt)}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  $('#gmembers').scrollIntoView({ behavior: 'smooth' });
}
async function disbandGuild(id, name) {
  if (!confirm(`Giải tán bang hội ${name}? Không thể hoàn tác!`)) return;
  await api('/guild/' + id, { method: 'DELETE' });
  toast('Đã giải tán bang hội'); loadPage();
}

/* ==================== Thời trang ==================== */
const KIND_VI = { title:'Danh hiệu', avatarFrame:'Khung avatar', chatFrame:'Khung chat',
                  skin:'Skin nhân vật', monSkin:'Skin Tuxemon' };
const howName = h => META.howNames?.[h] || h;
let cosRows = [];

function howText(c) {
  if (c.how === 'start') return 'Có sẵn từ đầu';
  if (c.how === 'manual') return '<b style="color:var(--warn)">Admin trao tay</b>';
  if (c.how === 'guild') return 'Đang ở trong bang hội';
  return esc(howName(c.how).replace('N', fmt(c.n)));
}

// Giải thích điều kiện đang chọn + ẩn ô N khi điều kiện không cần mốc
function hintHow() {
  const h = $('#co-how')?.value;
  if (!h) return;
  const canN = !['start', 'manual', 'guild'].includes(h);
  $('#co-n').disabled = !canN;
  $('#co-hint').innerHTML = canN
    ? `Người chơi đạt <b>${esc(howName(h).replace('N', 'N'))}</b> là món tự mở khoá — điền mốc <b>N</b> bên trên.`
    : h === 'manual'
      ? 'Món này <b>không tự mở</b> được — vào mục Người chơi bấm 🏷 để trao tay.'
      : `Điều kiện <b>${esc(howName(h))}</b> không cần mốc N.`;
}

async function saveCosmetic() {
  const body = {
    kind: $('#co-kind').value, id: $('#co-id').value, name: $('#co-name').value,
    color: $('#co-color').value, how: $('#co-how').value, n: $('#co-n').value, sp: $('#co-sp').value,

function editCosmetic(i) {
  const c = cosRows[i];

  $('#co-kind').value = c.kind; $('#co-id').value = c.id; $('#co-name').value = c.name;

async function delCosmetic(key, name) {

  toast('Đã xóa'); loadPage();
}
async function dropImage(key) {
  await api(`/cosmetics/${encodeURIComponent(key)}/image`, { method: 'DELETE' });

}

/* ==== Chọn tệp dùng chung: ảnh thời trang và ảnh kho chung ==== */
let pickMode = null;      // { url, then }
function pickFile(url, then) {
  pickMode = { url, then };
  const f = $('#file-pick');
  f.value = ''; f.click();
}
function pickCosImage(key) {
  pickFile(`/api/admin/cosmetics/${encodeURIComponent(key)}/image`, () => loadPage());
}
$('#file-pick').addEventListener('change', async (e) => {
  const file = e.target.files?.[0];
  if (!file || !pickMode) return;
  if (file.size > 2 * 1024 * 1024) return toast('Ảnh tối đa 2MB');
  try {
    // Gửi thẳng tệp trong body, Content-Type là kiểu ảnh — máy chủ đọc bằng express.raw
    const res = await fetch(pickMode.url, {
      method: 'POST',
      headers: { 'Content-Type': file.type, Authorization: 'Bearer ' + token },
      body: file,
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.error || 'Tải ảnh thất bại');
    toast('Đã tải ảnh lên');
    pickMode.then?.(d);
  } catch (err) { toast(err.message); }
});

    $('#grant-box').innerHTML = `

          return `<tr>

const EV_MAU = {
  tasks: () => ({ id: '', name: '', var: (META.vars?.[0]?.id) || 'wins', need: 10, reward: 5 }),
  shop:  () => ({ id: '', name: '', img: '', cost: 20, limit: 1, itemId: '', itemN: 1, money: 0 }),

};
// Gom giá trị đang gõ trên form vào EV trước mỗi lần vẽ lại, kẻo mất công gõ
function thuEv() {
  if (!$('#ev-name')) return;
  EV.name = $('#ev-name').value;
  EV.desc = $('#ev-desc').value;
  EV.banner = $('#ev-banner').value;
  EV.on = $('#ev-on').value === '1';
  EV.start = fromLocal($('#ev-start').value);
  EV.end = fromLocal($('#ev-end').value);
  EV.token = { id: $('#tk-id').value, name: $('#tk-name').value, img: $('#tk-img').value };
  EV.gachaCost = Number($('#ev-gcost').value) || 10;
  for (const [key, attr] of [['tasks', 't'], ['shop', 's'], ['gacha', 'g']]) {
    document.querySelectorAll(`[data-${attr}]`).forEach(el => {
      const row = EV[key][Number(el.dataset[attr])];
      if (row) row[el.dataset.f] = el.value;
    });
  }
}
function evAdd(key) { thuEv(); EV[key].push(EV_MAU[key]()); drawEvents(); }
function evDel(key, i) { thuEv(); EV[key].splice(i, 1); drawEvents(); }
function newEvent() { EV = evMoi(); drawEvents(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function editEvent(i) {
  EV = JSON.parse(JSON.stringify(evRows[i]));
  EV.token = EV.token || { id: 'token', name: 'Đồng sự kiện', img: '' };
  for (const k of ['tasks', 'shop', 'gacha']) EV[k] = EV[k] || [];
  drawEvents();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
async function saveEvent() {
  thuEv();

// "potion x5, super_potion x2" -> [{id:'potion',n:5},...]
function docItems(s) {
  return String(s || '').split(',').map(x => x.trim()).filter(Boolean).map(x => {
    const m = x.match(/^(\S+)\s*[x*×]\s*(\d+)$/i);
    return m ? { id: m[1], n: Number(m[2]) } : { id: x.split(/\s+/)[0], n: 1 };
  });
}

}
