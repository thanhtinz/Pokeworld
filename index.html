<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e3350d">
  <title>TuxeWorld H5</title>
  <meta name="description" content="Game Tuxemon H5 chơi trên trình duyệt — bắt, huấn luyện, đấu gym.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Thanh trên: avatar, tên, cấp huấn luyện viên, tiền — hiện ở mọi màn chơi -->
    <header id="top-bar" hidden>
      <button id="tb-ava" type="button" aria-label="Trang trí"><span class="ava-face" id="tb-face"></span></button>
      <span class="tb-mid">
        <b id="tb-name"></b>
        <small id="tb-lv"></small>
      </span>
      <span class="tb-money">
        <span class="nav-ico tb-coin" data-ico="coin"></span>
        <b id="tb-money">0</b>₽
      </span>
      <button id="tb-mail" class="tb-icon" type="button" aria-label="Hộp thư">
        <span class="tb-glyph">✉</span><span class="tb-dot" id="tb-mail-n" hidden></span>
      </button>
      <button id="tb-news" class="tb-icon" type="button" aria-label="Thông báo">
        <span class="tb-glyph">🔔</span><span class="tb-dot" id="tb-news-n" hidden></span>
      </button>
    </header>
    <main id="screen"></main>
    <nav id="bottom-nav" hidden>
      <button data-nav="home"><span class="nav-ico" data-ico="map"></span><span class="nav-lb">Bản đồ</span></button>
      <button data-nav="party"><span class="nav-ico" data-ico="team"></span><span class="nav-lb">Đội</span></button>
      <button data-nav="bag"><span class="nav-ico" data-ico="bag"></span><span class="nav-lb">Túi</span></button>
      <button data-nav="character"><span class="nav-ico" data-ico="person"></span><span class="nav-lb">Nhân vật</span></button>
      <button data-nav="dex"><span class="nav-ico" data-ico="book"></span><span class="nav-lb">Tuxedex</span></button>
      <button data-nav="menu"><span class="nav-ico"><span class="nav-burger"></span></span><span class="nav-lb">Menu</span></button>
    </nav>

    <!-- Chat nổi ở góc phải: bấm là mở trang trò chuyện, có tin mới thì hiện chấm đỏ -->
    <button id="chat-fab" type="button" aria-label="Trò chuyện" hidden>
      <span class="nav-ico" data-ico="chat"></span>
      <i class="nav-dot" id="nav-dot" hidden></i>
    </button>
  </div>
  <div id="toast-wrap"></div>
  <div id="modal-wrap"></div>
  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
      // Bản mới thay bản cũ -> tải lại MỘT lần. Không có bước này thì máy đang mở
      // game sẽ chạy lẫn lộn tệp cũ với tệp mới, có màn mở ra trắng trơn.
      let daTaiLai = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (daTaiLai) return;
        daTaiLai = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
